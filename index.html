<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C0B0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Casting Room" />
  <title>Casting Room</title>
  <script src="img/dust.js"></script>
  <script src="img/noir.js"></script>
  <script src="img/action.js"></script>
  <script src="img/court.js"></script>
  <script src="img/winter.js"></script>
  <script src="img/sampleDust.js"></script>
  <script src="img/sampleNoir.js"></script>
  <script src="img/sampleAction.js"></script>
  <script src="img/sampleCourt.js"></script>
  <script src="img/sampleWinter.js"></script>
  <script src="img/sampleDog.js"></script>
  <style>
    :root {
      --paper: #0c0b0a;
      --ink: #efe7d6;
      --muted: #9a9388;
      --surface: #161412;
      --accent: #efe7d6;
      --accent-fg: #0c0b0a;
      --line: #2e2a26;
      --display: Palatino, "Iowan Old Style", "Times New Roman", serif;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
      --cond: "Arial Narrow", "Segoe UI Condensed", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, textarea { font: inherit; color: inherit; }
    h1, h2 { font-family: var(--display); font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; margin: 0; }
    p { text-wrap: pretty; margin: 0; }
    .wrap { max-width: 32rem; margin: 0 auto; min-height: 100dvh; padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem 6.5rem; }
    .kicker { font-family: var(--cond); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
    .btn { min-height: 48px; border: 0; border-radius: 14px; padding: 0 1.1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; width: 100%; }
    .btn:active { transform: scale(.98); }
    .btn[disabled] { opacity: .4; }
    .primary { background: var(--accent); color: var(--accent-fg); }
    .secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
    .ghost { background: transparent; border: 0; min-height: 44px; }
    .field { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 .75rem; }
    textarea.field { min-height: 88px; padding: .7rem .75rem; }
    label.lbl { display: block; font-size: .85rem; font-weight: 500; color: var(--muted); margin: .85rem 0 .35rem; }
    .muted { color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .poster { position: relative; aspect-ratio: 2/3; width: 100%; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); padding: 0; background: #000; text-align: left; }
    .poster img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .poster .scrim { position: absolute; inset: 0; background: linear-gradient(to top, #0c0b0a, transparent 55%); }
    .poster .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; }
    .poster .genre { font-family: var(--cond); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .poster .ttl { font-family: var(--display); font-size: 1rem; line-height: 1.15; margin-top: 4px; }
    .poster .badge { position: absolute; right: 8px; top: 8px; border-radius: 999px; padding: 4px 8px; font-family: var(--cond); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgb(12 11 10 / .7); }
    .poster.on { border-color: var(--accent); }
    .poster.on .badge { background: var(--accent); color: var(--accent-fg); }
    .poster.dim { opacity: .45; }
    .face { position: absolute; left: 50%; top: 6%; width: 78%; height: 58%; transform: translateX(-50%); object-fit: cover; object-position: center 18%;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 62%, transparent 92%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 62%, transparent 92%); }
    .thumbs { display: flex; gap: 8px; }
    .thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
    pre { white-space: pre-wrap; font-family: inherit; margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; font-size: .9rem; line-height: 1.5; max-height: 16rem; overflow: auto; }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; background: rgb(12 11 10 / .95); border-top: 1px solid var(--line); }
    .dock .inner { max-width: 32rem; margin: 0 auto; display: flex; gap: 8px; padding: 10px 1.25rem max(10px, env(safe-area-inset-bottom)); }
    .toast { position: fixed; left: 50%; top: max(1rem, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .7rem 1rem; border-radius: 12px; font-size: .9rem; z-index: 40; display: none; }
    ol.how { margin: 1.25rem 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
    ol.how li { font-size: .95rem; line-height: 1.45; }
    ol.how b { font-family: var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-size: .75rem; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <div id="app"></div>
  <script>
  const KEY = "casting.room.file.v1";
  const IMG = window.CR_IMG || {};
  const LOOKS = [
    { id:"dust", plate:IMG.dust, sample:IMG.sampleDust, genre:"Western", name:"Dust & Gold", title:(n)=>star(n)+" RIDES" },
    { id:"noir", plate:IMG.noir, sample:IMG.sampleNoir, genre:"Noir", name:"After Dark", title:(n)=>star(n)+" AFTER DARK" },
    { id:"action", plate:IMG.action, sample:IMG.sampleAction, genre:"Action", name:"Last Run", title:(n)=>star(n)+": LAST RUN" },
    { id:"court", plate:IMG.court, sample:IMG.sampleCourt, genre:"Royal", name:"House of Fur", title:(n)=>"HOUSE OF "+star(n) },
    { id:"winter", plate:IMG.winter, sample:IMG.sampleWinter, genre:"Holiday epic", name:"Winter Bill", title:(n)=>star(n)+" AT DUSK" }
  ];

  function star(name) {
    const n = (name || "").trim() || "YOUR DOG";
    return n.length > 18 ? n.slice(0,16).trim() + "…" : n.toUpperCase();
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, "&" + "amp;")
      .replace(/</g, "&" + "lt;")
      .replace(/>/g, "&" + "gt;")
      .replace(/"/g, "&" + "quot;");
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
  }
  function save(part) {
    const next = Object.assign(load(), part);
    localStorage.setItem(KEY, JSON.stringify(next));
    return next;
  }
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.style.display = "none"; }, 1800);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const el = document.createElement("textarea");
      el.value = text;
      el.setAttribute("readonly", "");
      el.style.position = "fixed";
      el.style.left = "-9999px";
      document.body.appendChild(el);
      el.select();
      const ok = document.execCommand("copy");
      el.remove();
      return ok;
    }
  }

  const state = {
    step: "gate",
    shop: load().shop || "",
    star: "",
    notes: "",
    photos: [],
    sample: false,
    picked: []
  };

  function packet() {
    const shop = state.shop.trim() || "your shop";
    const looks = state.picked.map((id, i) => {
      const look = LOOKS.find((l) => l.id === id);
      return (i+1) + ". " + look.name + " — " + look.genre + " — " + look.title(state.star);
    }).join("\n");
    return "CASTING ROOM\nOrder for " + shop + " — 3 cinematic prints\n\nSTAR\n" +
      (state.star.trim() || "(name missing)") + "\n\nLOOKS (pick 3)\n" + looks +
      "\n\nNOTES\n" + (state.notes.trim() || "—") +
      "\n\nPHOTOS\nAttach 1–3 clear photos in this Etsy message.\nEyes visible. Front light. No photos of a screen.";
  }

  function posterHTML(look, opts) {
    const on = opts.selected ? " on" : "";
    const dim = opts.dimmed ? " dim" : "";
    const art = opts.sample ? look.sample : look.plate;
    const face = (!opts.sample && opts.photo) ? '<img class="face" alt="" src="'+opts.photo+'"/>' : "";
    const badge = opts.tap ? '<span class="badge">'+(opts.selected?"Cast":"Tap")+'</span>' : "";
    return '<button type="button" class="poster'+on+dim+'" data-id="'+look.id+'">' +
      '<img class="bg" alt="" src="'+art+'"/>' +
      '<div class="scrim"></div>' + face +
      '<div class="meta"><div class="genre">'+esc(look.genre)+'</div><div class="ttl">'+esc(look.title(state.star))+'</div></div>' +
      badge + "</button>";
  }

  function render() {
    const app = document.getElementById("app");
    if (state.step === "gate") {
      app.innerHTML = '<div class="wrap">' +
        '<p class="kicker">Casting Room</p>' +
        '<h1 style="margin-top:1rem;font-size:2.1rem;line-height:1.08">Five cinematic looks. You pick three. A person finishes the print.</h1>' +
        '<p class="muted" style="margin-top:1rem">Open this page in Safari. Nothing is uploaded until you copy a note into Etsy.</p>' +
        '<ol class="how">' +
        '<li><b>1 ·</b> Put your shop name in once.</li>' +
        '<li><b>2 ·</b> You or your customer tap three posters.</li>' +
        '<li><b>3 ·</b> Copy the note. Send it on Etsy with the real photos.</li>' +
        '</ol>' +
        '<label class="lbl" for="shop">Your Etsy shop name</label>' +
        '<input class="field" id="shop" value="'+esc(state.shop)+'" placeholder="YourShopName"/>' +
        '<div class="stack" style="margin-top:1.25rem">' +
        '<button class="btn primary" id="sample">Try with a sample dog</button>' +
        '<button class="btn secondary" id="own">Use your own photos</button>' +
        '</div></div>';
      document.getElementById("shop").oninput = (e) => { state.shop = e.target.value; save({ shop: state.shop }); };
      document.getElementById("sample").onclick = () => {
        state.shop = document.getElementById("shop").value.trim() || state.shop;
        save({ shop: state.shop });
        state.star = state.star || "Honey";
        state.photos = [IMG.sampleDog];
        state.sample = true;
        state.picked = [];
        state.step = "looks";
        render();
      };
      document.getElementById("own").onclick = () => {
        state.shop = document.getElementById("shop").value.trim() || state.shop;
        save({ shop: state.shop });
        state.step = "sheet";
        render();
      };
      return;
    }
    if (state.step === "sheet") {
      app.innerHTML = '<div class="wrap">' +
        '<p class="kicker">Call sheet</p>' +
        '<h2 style="margin-top:.4rem;font-size:2rem">The star</h2>' +
        '<label class="lbl" for="star">Dog name</label>' +
        '<input class="field" id="star" value="'+esc(state.star)+'" placeholder="Honey"/>' +
        '<label class="lbl" for="photos">Photos (stay on this phone)</label>' +
        '<input class="field" id="photos" type="file" accept="image/*" multiple/>' +
        '<div class="thumbs" id="thumbs"></div>' +
        '<label class="lbl" for="notes">Notes for the artist</label>' +
        '<textarea class="field" id="notes" placeholder="White chest. No collar in the print.">'+esc(state.notes)+'</textarea>' +
        '<div class="stack" style="margin-top:1.25rem">' +
        '<button class="btn primary" id="go">See the five looks</button>' +
        '<button class="btn secondary" id="sample">Try with a sample dog</button>' +
        '<button class="btn ghost" id="back">Back</button>' +
        '</div></div>';
      const thumbs = document.getElementById("thumbs");
      function paintThumbs() {
        thumbs.innerHTML = state.photos.filter(function(u){ return u !== IMG.sampleDog; }).map(function(u){ return '<img alt="" src="'+u+'"/>'; }).join("");
      }
      paintThumbs();
      document.getElementById("photos").onchange = (e) => {
        const files = [...(e.target.files || [])].slice(0, 3);
        state.photos.forEach((u) => { if (u !== IMG.sampleDog) URL.revokeObjectURL(u); });
        state.photos = files.map((f) => URL.createObjectURL(f));
        state.sample = false;
        paintThumbs();
      };
      document.getElementById("go").onclick = () => {
        state.star = document.getElementById("star").value;
        state.notes = document.getElementById("notes").value;
        if (!state.star.trim()) { toast("Add the dog name"); return; }
        state.step = "looks";
        render();
      };
      document.getElementById("sample").onclick = () => {
        state.star = document.getElementById("star").value.trim() || "Honey";
        state.notes = document.getElementById("notes").value;
        state.photos = [IMG.sampleDog];
        state.sample = true;
        state.picked = [];
        state.step = "looks";
        render();
      };
      document.getElementById("back").onclick = () => { state.step = "gate"; render(); };
      return;
    }
    if (state.step === "looks") {
      const photo = state.photos[0] || "";
      app.innerHTML = '<div class="wrap">' +
        '<p class="kicker">First looks</p>' +
        '<h2 style="margin-top:.4rem;font-size:2rem">Tap three posters</h2>' +
        '<p class="muted" style="margin-top:.5rem">These are proofs. The print you sell is finished by hand.</p>' +
        '<div class="grid" style="margin-top:1rem">' +
        LOOKS.map((look) => posterHTML(look, {
          sample: state.sample,
          photo: photo,
          selected: state.picked.includes(look.id),
          dimmed: state.picked.length === 3 && !state.picked.includes(look.id),
          tap: true
        })).join("") +
        "</div></div>" +
        '<div class="dock"><div class="inner">' +
        '<button class="btn secondary" id="back" style="width:auto;padding:0 1rem">Back</button>' +
        '<button class="btn primary" id="next">' +
        (state.picked.length === 3 ? "Build the Etsy note" : state.picked.length + " / 3 selected") +
        "</button></div></div>";
      app.querySelectorAll(".poster").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-id");
          if (state.picked.includes(id)) state.picked = state.picked.filter((x) => x !== id);
          else if (state.picked.length >= 3) { toast("Three looks only"); return; }
          else state.picked.push(id);
          render();
        };
      });
      document.getElementById("back").onclick = () => { state.step = "sheet"; render(); };
      document.getElementById("next").onclick = () => {
        if (state.picked.length !== 3) { toast("Tap " + (3 - state.picked.length) + " more"); return; }
        state.step = "call";
        render();
      };
      return;
    }
    const p = packet();
    app.innerHTML = '<div class="wrap">' +
      '<p class="kicker">The call</p>' +
      '<h2 style="margin-top:.4rem;font-size:2rem">Send this on Etsy</h2>' +
      '<p class="muted" style="margin-top:.5rem">Copy the brief. Attach the real photos in the shop message. This file does not log into Etsy.</p>' +
      '<div class="grid3" style="margin-top:1rem">' +
      state.picked.map((id) => posterHTML(LOOKS.find((l) => l.id === id), { sample: state.sample, photo: state.photos[0] || "", selected: true, tap: false })).join("") +
      "</div>" +
      '<pre id="pkt" style="margin-top:1rem">'+esc(p)+'</pre>' +
      '<div class="stack" style="margin-top:1rem">' +
      '<button class="btn primary" id="copy">Copy the brief</button>' +
      '<button class="btn ghost" id="back">Change looks</button>' +
      "</div></div>";
    document.getElementById("copy").onclick = async () => {
      const ok = await copyText(p);
      toast(ok ? "Brief copied" : "Select the text and copy it");
    };
    document.getElementById("back").onclick = () => { state.step = "looks"; render(); };
  }
  render();
  </script>
</body>
</html>
