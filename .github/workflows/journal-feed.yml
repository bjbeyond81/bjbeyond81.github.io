name: Journal feed
# Rebuilds the BJ Beyond Journal (studio/) from the platforms' public feeds:
# studio/data/articles.json, studio/data/news.json, studio/data/raw.json,
# studio/feed.xml, studio/news.xml and the pre-rendered blocks in studio/index.html.
# Commits only when something changed. Pages deploys from main (branch deploy), so
# the commit itself publishes the update.
on:
  schedule:
    - cron: '17 5 * * *'   # daily, 05:17 UTC (06:17 Rome in winter, 07:17 in summer)
    - cron: '17 13 * * *'  # backup, 13:17 UTC (14:17 Rome in winter), in case the morning run is skipped
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: journal-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feeds (standard library only)
        run: python3 studio/scripts/build_feed.py
      - name: Check the brand spelling
        run: |
          if grep -rn "B[j] Beyond" studio/index.html studio/feed.xml studio/news.xml studio/data/articles.json studio/data/news.json; then
            echo "Brand must be written 'BJ Beyond'"; exit 1; fi
      - name: Commit if changed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio/data/articles.json studio/data/news.json studio/data/raw.json studio/feed.xml studio/news.xml studio/index.html
          # The featured cover is downloaded into studio/assets/covers/ by build_feed.py,
          # which also removes the previous one. -A stages both, so the page never points at a missing file.
          git add -A studio/assets/covers
          if git diff --cached --quiet; then echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Journal: refresh articles and AI news feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request a Pages build
        # A push made with GITHUB_TOKEN may not start the legacy Pages build on its own;
        # this asks for one explicitly. Harmless if a build is already queued.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will rebuild."
